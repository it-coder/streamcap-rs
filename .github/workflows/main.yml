name: 'publish'

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 👈 关键：拉取完整历史，否则无法正确生成变更日志

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # 👇 先构建，但不创建 Release（只构建不上传）
      - name: build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          releaseId: none  # 不创建 Release，只构建

      # 👇 计算 bundle 产物路径：指定 --target 交叉编译时产物在 target/<triple>/release/bundle 下，否则在 target/release/bundle 下
      - name: 计算产物路径
        id: bundle-path
        shell: bash
        run: |
          if [ -n "${{ matrix.args }}" ]; then
            # 从 args（如 "--target aarch64-apple-darwin"）中提取 triple
            TRIPLE=$(printf '%s' "${{ matrix.args }}" | sed 's/--target //')
            printf 'path=target/%s/release/bundle/**/*\n' "$TRIPLE" >> "$GITHUB_OUTPUT"
          else
            printf 'path=target/release/bundle/**/*\n' >> "$GITHUB_OUTPUT"
          fi
          echo "解析出的产物路径: $(cat "$GITHUB_OUTPUT" | grep '^path=' | cut -d= -f2)"

      # 👇 上传构建产物作为 workflow artifacts（供后续步骤使用）
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.args }}
          path: ${{ steps.bundle-path.outputs.path }}
          if-no-files-found: error  # 找不到产物直接失败，避免静默漏传

  # 👇 单独的 job：在所有平台构建完成后，创建带自动生成说明的 Release
  create-release:
    needs: publish-tauri  # 等待所有构建完成
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release（自动生成发布说明）
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "Release ${{ github.ref_name }}" \
            --draft=false \
            --prerelease=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传所有构建产物到 Release
        run: |
          find artifacts -type f -name "*.app" -o -name "*.deb" -o -name "*.msi" -o -name "*.dmg" | while read file; do
            gh release upload "${{ github.ref_name }}" "$file" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
