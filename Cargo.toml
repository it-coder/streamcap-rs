[package]
name = "streamcap-rs"
version = "0.4.0"
description = "Rust直播流录制工具 — 基于streamget-rs + Tauri"
edition = "2021"
default-run = "streamcap-rs"

[[bin]]
name = "streamcap-rs"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "streamcap-server"
path = "src/bin/server.rs"
required-features = ["server"]

[lib]
name = "streamcap_rs"
path = "src/lib.rs"

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-fs",
]
server = [
    "dep:axum",
    "dep:tower-http",
]

[dependencies]
# 共享依赖（两种模式都需要）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
thiserror = "1"
url = "2"
regex = "1"
async-trait = "0.1"
hex = "0.4"
base64 = "0.22"
md-5 = "0.10"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures-util = "0.3"
fs2 = "0.4"

# Desktop 依赖 (optional)
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }

# Server 依赖 (optional)
axum = { version = "0.7", optional = true, features = ["ws"] }
tower-http = { version = "0.5", optional = true, features = ["fs", "cors"] }

# Local dependency: stream resolution library
streamget-rs = { git = "https://github.com/it-coder/streamget-rs.git", branch = "master" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
