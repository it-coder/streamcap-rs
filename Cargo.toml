[package]
name = "streamcap-rs"
version = "0.1.0"
description = "Rust直播流录制工具 — 基于streamget-rs + Tauri"
edition = "2021"

[[bin]]
name = "streamcap-rs"
path = "src/main.rs"

[lib]
name = "streamcap_rs"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
thiserror = "1"
url = "2"
regex = "1"
async-trait = "0.1"
hex = "0.4"
base64 = "0.22"
md-5 = "0.10"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures-util = "0.3"

# Local dependency: stream resolution library
streamget-rs = {
    git = "https://github.com/it-coder/streamget-rs.git",
    branch = "master"
}

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
